name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which has no prebuilt Python 3.8
    # (the cause of the original failure). 3.8 is also EOL.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install btrfs tools (for the loop-mount CoW test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v -rs
      - name: Smoke-test console script
        run: |
          guttman --version
          guttman advise . > /dev/null

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The package has no runtime dependencies, so audit the environment a
      # contributor/CI actually installs (package + test extra + tooling).
      - name: pip-audit (installed environment)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pip-audit
          pip-audit --skip-editable

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install build twine
          python -m build
          twine check dist/*
