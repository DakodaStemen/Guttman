name: Publish to PyPI

# PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
# One-time setup on pypi.org (project "guttman" -> Publishing): add a trusted
# publisher for owner DakodaStemen, repo Guttman, workflow publish.yml,
# environment "pypi". Then create a GitHub Release to trigger this.
# This workflow has NOT been run.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only publish from a published release, never from a manual dry dispatch.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/guttman
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
